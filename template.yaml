AWSTemplateFormatVersion: '2010-09-09'
Description: "Bedrock Cost Guard - usage monitor + daily reconciler + cost estimation (serverless, one-click deploy)"

Parameters:
  GitHubOwner:
    Type: String
    Default: huizi-2003
    Description: GitHub repository owner.
  GitHubRepo:
    Type: String
    Default: sample-cost-guard-for-amazon-bedrock
    Description: GitHub repository name.
  SourceRevision:
    Type: String
    Default: ''
    Description: >
      Commit SHA or tag to deploy. Leave EMPTY to auto-resolve the latest
      published GitHub Release (recommended). The auto-updater always pins an
      explicit SHA here. Set a value manually only to deploy a specific version.
  AutoUpgradeEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Automatically check for new GitHub Releases every week and upgrade the
      whole stack. Can also be toggled later from the Web Console.
  Version:
    Type: String
    Default: '1'
    Description: >
      Change this value to force a code re-fetch without changing SourceRevision.
      Not needed when auto-upgrade is enabled.
  AllowedCidrs:
    Type: CommaDelimitedList
    Default: 127.0.0.1/32
    Description: >
      Comma-separated CIDRs allowed to access the Web Console
      (e.g. 1.2.3.4/32,5.6.7.0/24). Default is closed.

Resources:
  # ===== S3 bucket for Lambda code (auto-created) =====
  CodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ===== Bootstrap: download source zip from GitHub into CodeBucket =====
  CodeFetcherRole:
    Type: AWS::IAM::Role
    Properties:
      # 显式命名：StackUpdateRole 的 IAM 策略按 role/${AWS::StackName}-* 授权，
      # 而 CloudFormation 自动生成的角色名在栈名较长时会被截断，导致匹配失败。
      RoleName: !Sub "${AWS::StackName}-code-fetcher-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeFetcherPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  CodeFetcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-code-fetcher"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CodeFetcherRole.Arn
      Timeout: 600        # agent 依赖约 27MB 下载 + 三个 zip 构建，留足余量
      MemorySize: 1024    # zip 全部在内存 BytesIO 里构建，且内存越大 CPU 越快
      Code:
        ZipFile: |
          import urllib.request, urllib.error, boto3, zipfile, io, subprocess, tempfile, os, json, datetime, re
          GH_API = 'https://api.github.com'
          SHA_RE = re.compile(r'^[0-9a-f]{7,40}$')
          def _api(url, sha=False):
              hdr = {'User-Agent': 'cfn-bootstrap',
                     'Accept': 'application/vnd.github.sha' if sha else 'application/vnd.github+json'}
              req = urllib.request.Request(url, headers=hdr)
              return urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          def _resolve(owner, repo, revision):
              # 返回 (sha, tag)。SourceRevision 为空时解析最新正式 Release。
              # 注意：release 的 target_commitish 常常是分支名而非 SHA，不可直接使用，
              # 必须再解析一次 tag 才能拿到不可变的 commit SHA。
              if revision:
                  sha = _api('%s/repos/%s/%s/commits/%s' % (GH_API, owner, repo, revision), sha=True).strip()
                  return sha, ('' if SHA_RE.match(revision) else revision)
              try:
                  data = json.loads(_api('%s/repos/%s/%s/releases/latest' % (GH_API, owner, repo)))
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      raise Exception(
                          '%s/%s has no published GitHub Release. This project follows Releases, '
                          'not branches. Create a Release in that repo first, or set the '
                          'SourceRevision parameter to a specific commit SHA.' % (owner, repo))
                  raise
              tag = (data.get('tag_name') or '').strip()
              if not tag:
                  raise Exception('latest release of %s/%s has no tag_name' % (owner, repo))
              sha = _api('%s/repos/%s/%s/commits/%s' % (GH_API, owner, repo, tag), sha=True).strip()
              return sha, tag
          def _send(event, context, status, data, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or ('See CloudWatch Log Stream: ' + context.log_stream_name),
                  'PhysicalResourceId': event.get('PhysicalResourceId') or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              }).encode('utf-8')
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',
                                           headers={'content-type': '', 'content-length': str(len(body))})
              urllib.request.urlopen(req, timeout=30)
          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      # 删栈时清空 CodeBucket，否则非空桶会导致 DELETE_FAILED。
                      # best-effort：清空失败也不阻塞栈删除。
                      try:
                          b = event.get('ResourceProperties', {}).get('Bucket')
                          if b:
                              s3 = boto3.client('s3')
                              pg = s3.get_paginator('list_object_versions')
                              for page in pg.paginate(Bucket=b):
                                  objs = [{'Key': o['Key'], 'VersionId': o['VersionId']}
                                          for o in page.get('Versions', [])]
                                  objs += [{'Key': o['Key'], 'VersionId': o['VersionId']}
                                           for o in page.get('DeleteMarkers', [])]
                                  if objs:
                                      s3.delete_objects(Bucket=b, Delete={'Objects': objs})
                      except Exception:
                          pass
                      _send(event, context, 'SUCCESS', {})
                      return
                  p = event['ResourceProperties']
                  owner, repo = p['Owner'], p['Repo']
                  # SourceRevision 为空 → 跟随最新正式 Release；非空 → 精确部署该版本。
                  # 无论哪条路径，最终都锁定到不可变的 commit SHA 再下载，
                  # 绝不使用 refs/heads/<branch>.zip 这类会移动的引用。
                  sha, tag = _resolve(owner, repo, (p.get('SourceRevision') or '').strip())
                  src_url = 'https://github.com/%s/%s/archive/%s.zip' % (owner, repo, sha)
                  print('resolved revision: sha=%s tag=%s' % (sha, tag))
                  req = urllib.request.Request(src_url, headers={'User-Agent': 'cfn-bootstrap'})
                  raw = urllib.request.urlopen(req, timeout=120).read()
                  src = zipfile.ZipFile(io.BytesIO(raw))

                  build_info = (
                      'COMMIT_SHA = "%s"\nRELEASE_TAG = "%s"\nBUILD_TIME = "%s"\n'
                      % (sha, tag, datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')))

                  # Build lambda.zip (monitor + reconciler + updater + common)
                  buf = io.BytesIO()
                  with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as out:
                      for name in src.namelist():
                          if name.endswith('/'):
                              continue
                          parts = name.split('/', 1)
                          inner = parts[1] if len(parts) > 1 else parts[0]
                          if inner and inner.startswith(('common/', 'monitor/', 'reconciler/', 'updater/')):
                              out.writestr(inner, src.read(name))
                      out.writestr('common/build_info.py', build_info)
                  buf.seek(0)
                  s3 = boto3.client('s3')
                  resp1 = s3.put_object(Bucket=p['Bucket'], Key='lambda.zip', Body=buf.read())

                  # Build web.zip (web/ + common/ + mangum dependency)
                  tmpdir = tempfile.mkdtemp()
                  # Extract web/ and common/ to tmpdir
                  for name in src.namelist():
                      if name.endswith('/'):
                          continue
                      parts = name.split('/', 1)
                      inner = parts[1] if len(parts) > 1 else parts[0]
                      if inner and inner.startswith(('web/', 'common/')):
                          dest = os.path.join(tmpdir, inner)
                          os.makedirs(os.path.dirname(dest), exist_ok=True)
                          with open(dest, 'wb') as f:
                              f.write(src.read(name))
                  # Install web dependencies from requirements.txt (fastapi/mangum/boto3),
                  # 回退到显式安装 fastapi+mangum，避免缺依赖导致 500。
                  with open(os.path.join(tmpdir, 'common', 'build_info.py'), 'w') as f:
                      f.write(build_info)
                  req_file = os.path.join(tmpdir, 'web', 'requirements.txt')
                  if os.path.exists(req_file):
                      subprocess.check_call(['pip', 'install', '-r', req_file, '-t', tmpdir, '--quiet'])
                  else:
                      subprocess.check_call(['pip', 'install', 'fastapi', 'mangum', '-t', tmpdir, '--quiet'])
                  # Create web.zip
                  buf2 = io.BytesIO()
                  with zipfile.ZipFile(buf2, 'w', zipfile.ZIP_DEFLATED) as out:
                      for root, dirs, files in os.walk(tmpdir):
                          for f in files:
                              full = os.path.join(root, f)
                              arcname = os.path.relpath(full, tmpdir)
                              out.write(full, arcname)
                  buf2.seek(0)
                  resp2 = s3.put_object(Bucket=p['Bucket'], Key='web.zip', Body=buf2.read())

                  # Build agent.zip (agent/ code for AgentCore Runtime)
                  # AgentCore 直接代码部署不会自动装依赖，必须把 arm64 wheel 打进 zip
                  # （Runtime 为 PYTHON_3_13 / arm64，--only-binary 确保只拉预编译 wheel）
                  tmpdir2 = tempfile.mkdtemp()
                  for name in src.namelist():
                      if name.endswith('/'):
                          continue
                      parts = name.split('/', 1)
                      inner = parts[1] if len(parts) > 1 else parts[0]
                      if inner and inner.startswith('agent/'):
                          # Flatten: agent/main.py → main.py (AgentCore expects entrypoint at root)
                          flat_name = inner[len('agent/'):]
                          if flat_name:
                              dest = os.path.join(tmpdir2, flat_name)
                              os.makedirs(os.path.dirname(dest), exist_ok=True)
                              with open(dest, 'wb') as f:
                                  f.write(src.read(name))
                  subprocess.check_call([
                      'pip', 'install',
                      '--platform', 'manylinux2014_aarch64',
                      '--implementation', 'cp',
                      '--python-version', '3.13',
                      '--only-binary=:all:',
                      '--no-compile',
                      '-r', os.path.join(tmpdir2, 'requirements.txt'),
                      '-t', tmpdir2, '--quiet'
                  ])
                  buf3 = io.BytesIO()
                  with zipfile.ZipFile(buf3, 'w', zipfile.ZIP_DEFLATED) as out:
                      for root, dirs, files in os.walk(tmpdir2):
                          for f in files:
                              full = os.path.join(root, f)
                              arcname = os.path.relpath(full, tmpdir2)
                              out.write(full, arcname)
                  buf3.seek(0)
                  resp3 = s3.put_object(Bucket=p['Bucket'], Key='agent.zip', Body=buf3.read())

                  _send(event, context, 'SUCCESS', {
                      'LambdaVersionId': resp1.get('VersionId', 'null'),
                      'WebVersionId': resp2.get('VersionId', 'null'),
                      'AgentVersionId': resp3.get('VersionId', 'null'),
                      'CommitSha': sha,
                      'ReleaseTag': tag,
                  })
              except Exception as e:
                  # Reason 会直接显示在 CloudFormation 事件列表里，把"仓库没有 Release"
                  # 这类可操作的错误直接暴露给用户，而不是让人去翻 CloudWatch。
                  _send(event, context, 'FAILED', {'Error': str(e)}, reason=str(e)[:1000])

  CodeObject:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt CodeFetcherFunction.Arn
      Owner: !Ref GitHubOwner
      Repo: !Ref GitHubRepo
      # 空 = 解析最新正式 Release；非空 = 精确部署该 SHA/tag。
      # 自动升级时 Updater 总是写入明确的 SHA，因此这个属性变化会触发重新拉取代码。
      SourceRevision: !Ref SourceRevision
      Bucket: !Ref CodeBucket
      Key: lambda.zip
      Version: !Ref Version

  # ===== DynamoDB =====
  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bedrock-cost-guard
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expire_at
        Enabled: true

  # ===== Lambda IAM Role (shared by monitor + reconciler) =====
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockLiteGuardLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DeleteItem   # reconciler 幂等清理旧 per-model 记录需要
                Resource: !GetAtt ConfigTable.Arn
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                Resource: '*'
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  # ===== Lambda: Monitor =====
  MonitorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CodeObject
    Properties:
      FunctionName: !Sub "${AWS::StackName}-monitor"
      Runtime: python3.12
      Handler: monitor/handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: lambda.zip
        S3ObjectVersion: !GetAtt CodeObject.LambdaVersionId
      Role: !GetAtt LambdaRole.Arn
      Timeout: 180
      MemorySize: 512
      Environment:
        Variables:
          DDB_TABLE: !Ref ConfigTable

  # ===== Lambda: Reconciler =====
  ReconcilerFunction:
    Type: AWS::Lambda::Function
    DependsOn: CodeObject
    Properties:
      FunctionName: !Sub "${AWS::StackName}-reconciler"
      Runtime: python3.12
      Handler: reconciler/handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: lambda.zip
        S3ObjectVersion: !GetAtt CodeObject.LambdaVersionId
      Role: !GetAtt LambdaRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DDB_TABLE: !Ref ConfigTable
          AGENTCORE_ENDPOINT_ARN: !GetAtt AgentCoreEndpoint.AgentRuntimeEndpointArn

  # ===== Lambda: Web Console =====
  WebLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-web-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockLiteGuardWebPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DeleteItem
                Resource: !GetAtt ConfigTable.Arn
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-reconciler"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-web"
                  # 「立即升级」按钮只是异步触发 Updater，Web Lambda 自身
                  # 没有任何 CloudFormation 或 IAM 权限。
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-updater"
              - Effect: Allow
                Action:
                  - iam:ListUsers
                  - iam:ListRoles
                  - iam:ListGroups
                  - iam:ListAttachedUserPolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListAttachedGroupPolicies
                  - iam:ListUserPolicies
                  - iam:ListRolePolicies
                  - iam:ListGroupPolicies
                  - iam:ListGroupsForUser
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetUserPolicy
                  - iam:GetRolePolicy
                  - iam:GetGroupPolicy
                  - iam:GetGroup
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  WebFunction:
    Type: AWS::Lambda::Function
    DependsOn: CodeObject
    Properties:
      FunctionName: !Sub "${AWS::StackName}-web"
      Runtime: python3.12
      Handler: web/app.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: web.zip
        S3ObjectVersion: !GetAtt CodeObject.WebVersionId
      Role: !GetAtt WebLambdaRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DDB_TABLE: !Ref ConfigTable
          RECONCILER_FUNCTION_NAME: !Sub "${AWS::StackName}-reconciler"
          UPDATER_FUNCTION_NAME: !Sub "${AWS::StackName}-updater"
          STACK_NAME: !Ref "AWS::StackName"
          GITHUB_OWNER: !Ref GitHubOwner
          GITHUB_REPO: !Ref GitHubRepo
          AUTO_UPGRADE_DEFAULT: !Ref AutoUpgradeEnabled

  # ===== EventBridge Schedules =====
  MonitorSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-monitor-schedule"
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: MonitorLambda
          Arn: !GetAtt MonitorFunction.Arn

  ReconcilerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-reconciler-schedule"
      ScheduleExpression: cron(0 1 * * ? *)
      State: ENABLED
      Targets:
        - Id: ReconcilerLambda
          Arn: !GetAtt ReconcilerFunction.Arn

  MonitorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MonitorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonitorSchedule.Arn

  ReconcilerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReconcilerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReconcilerSchedule.Arn

  # ===== API Gateway (REST API) =====
  WebApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AWS::StackName}-web"
      Description: Bedrock Cost Guard Web Console
      EndpointConfiguration:
        Types:
          - REGIONAL
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: execute-api:Invoke
            Resource: execute-api:/*
          - Effect: Deny
            Principal: '*'
            Action: execute-api:Invoke
            Resource: execute-api:/*
            Condition:
              NotIpAddress:
                aws:SourceIp: !Ref AllowedCidrs

  WebApiRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref WebApi
      ResourceId: !GetAtt WebApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebFunction.Arn}/invocations"

  WebApiProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref WebApi
      ParentId: !GetAtt WebApi.RootResourceId
      PathPart: '{proxy+}'

  WebApiProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref WebApi
      ResourceId: !Ref WebApiProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebFunction.Arn}/invocations"

  # ===== Custom Resource: 强制在 AllowedCidrs/Version 变化时重新部署 API =====
  ApiDeploymentTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-api-deploy-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiGatewayDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - apigateway:POST
                  - apigateway:GET
                  - apigateway:DELETE
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${WebApi}/deployments*"

  ApiDeploymentTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api-deployment-trigger"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ApiDeploymentTriggerRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3, json, urllib.request
          apigw = boto3.client('apigateway')
          def send_response(event, context, status, data=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': f"See CloudWatch Log Stream: {context.log_stream_name}",
                  'PhysicalResourceId': data.get('id') if data else event.get('PhysicalResourceId', context.log_stream_name),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              })
              req = urllib.request.Request(event['ResponseURL'], data=body.encode(), method='PUT')
              urllib.request.urlopen(req)
          def handler(event, context):
              print(json.dumps(event))
              try:
                  req_type = event['RequestType']
                  props = event['ResourceProperties']
                  api_id = props['RestApiId']
                  description = props.get('Description', 'CloudFormation deployment')

                  if req_type == 'Delete':
                      dep_id = event.get('PhysicalResourceId', '')
                      try:
                          apigw.delete_deployment(restApiId=api_id, deploymentId=dep_id)
                          print(f"Deleted deployment {dep_id}")
                      except Exception as e:
                          # best-effort: API may already be gone, deployment still on stage,
                          # or PhysicalResourceId is a log stream name from failed Create
                          print(f"Skip deleting deployment {dep_id}: {e}")
                      send_response(event, context, 'SUCCESS', {'id': dep_id})
                      return

                  # Create/Update 都创建新的 Deployment（不指定 stageName，由 CFn Stage 资源管理）
                  resp = apigw.create_deployment(restApiId=api_id, description=description)
                  deployment_id = resp['id']
                  print(f"Created deployment {deployment_id}")
                  send_response(event, context, 'SUCCESS', {'id': deployment_id, 'DeploymentId': deployment_id})
              except Exception as e:
                  print(f"Error: {e}")
                  send_response(event, context, 'FAILED', {'error': str(e)})

  WebApiDeployment:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - WebApiRootMethod
      - WebApiProxyMethod
    Properties:
      ServiceToken: !GetAtt ApiDeploymentTriggerFunction.Arn
      RestApiId: !Ref WebApi
      # Description 包含 AllowedCidrs + Version，任一变化都触发重新创建
      Description: !Sub
        - "CIDRs=[${Cidrs}] v${Version}"
        - Cidrs: !Join [',', !Ref AllowedCidrs]

  WebApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref WebApi
      DeploymentId: !GetAtt WebApiDeployment.DeploymentId
      StageName: prod

  WebApiFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebApi}/*"

  # ===== 自动升级：CloudFormation service role =====
  # 整栈更新需要覆盖栈内全部资源类型的写权限。这些权限**不**挂在 Updater
  # Lambda 上，而是收在这个只有 CloudFormation 能扮演的角色里：
  # Updater 只能"请求 CloudFormation 去改"，它自己无法直接创建 IAM 角色或
  # 改动任何资源。即使 Updater 的版本判断逻辑被影响（仓库被投毒等），
  # 攻击者拿到的也只是"触发一次栈更新"，而不是账号内的直接写权限。
  StackUpdateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-stack-update-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                # 防混淆代理：只允许本账号的 CloudFormation 扮演
                aws:SourceAccount: !Ref "AWS::AccountId"
      Policies:
        - PolicyName: StackUpdatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # --- S3: CodeBucket 本身 + 桶内对象 ---
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketVersioning
                  - s3:GetBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}/*"
              # --- IAM: 仅限本栈前缀的角色（含删栈时删除自己） ---
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*"
              # --- Lambda ---
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*"
              # --- DynamoDB（仅本表；删除/替换由 Updater 的安全检查另行拦截）---
              - Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                Resource: !GetAtt ConfigTable.Arn
              # --- EventBridge ---
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:ListTagsForResource
                  - events:TagResource
                  - events:UntagResource
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${AWS::StackName}-*"
              # --- API Gateway ---
              # REST API 的 ID 在写策略时无法预知（部署才生成），只能放宽到
              # 本 Region 的 apigateway 控制面，这是此处无法消除的通配符。
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/*"
              # --- AgentCore（这些操作不支持资源级授权，只能 '*'）---
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreateAgentRuntime
                  - bedrock-agentcore:UpdateAgentRuntime
                  - bedrock-agentcore:DeleteAgentRuntime
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:ListAgentRuntimes
                  - bedrock-agentcore:CreateAgentRuntimeEndpoint
                  - bedrock-agentcore:UpdateAgentRuntimeEndpoint
                  - bedrock-agentcore:DeleteAgentRuntimeEndpoint
                  - bedrock-agentcore:GetAgentRuntimeEndpoint
                  - bedrock-agentcore:TagResource
                  - bedrock-agentcore:UntagResource
                Resource: '*'
              # --- 自定义资源需要 CloudFormation 回调 Lambda ---
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*"
              # --- Lambda 日志组 ---
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*"

  # ===== 自动升级：Updater Lambda =====
  UpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-updater-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UpdaterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # 仅本栈的变更集操作。注意这里没有任何 iam:* / lambda:Update* 等
              # 资源写权限——实际改动由 CloudFormation 扮演 StackUpdateRole 完成。
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
              # ValidateTemplate 不支持资源级授权
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                Resource: '*'
              # 把 StackUpdateRole 交给 CloudFormation 使用
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt StackUpdateRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              # 只能读写模板暂存前缀，碰不到 lambda.zip / web.zip / agent.zip
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}/templates/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt ConfigTable.Arn
              # 健康检查调 Web Lambda，以及超过 15 分钟时自调用续跑
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-web"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-updater"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  UpdaterFunction:
    Type: AWS::Lambda::Function
    DependsOn: CodeObject
    Properties:
      FunctionName: !Sub "${AWS::StackName}-updater"
      Runtime: python3.12
      Handler: updater/handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: lambda.zip
        S3ObjectVersion: !GetAtt CodeObject.LambdaVersionId
      Role: !GetAtt UpdaterRole.Arn
      Timeout: 900        # 整栈更新较慢，超时前会自调用续跑（见 MAX_WATCH_HOPS）
      MemorySize: 512
      Environment:
        Variables:
          DDB_TABLE: !Ref ConfigTable
          STACK_NAME: !Ref "AWS::StackName"
          GITHUB_OWNER: !Ref GitHubOwner
          GITHUB_REPO: !Ref GitHubRepo
          CODE_BUCKET: !Ref CodeBucket
          STACK_UPDATE_ROLE_ARN: !GetAtt StackUpdateRole.Arn
          WEB_FUNCTION_NAME: !Sub "${AWS::StackName}-web"
          AUTO_UPGRADE_DEFAULT: !Ref AutoUpgradeEnabled

  UpdaterSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-updater-schedule"
      Description: Weekly check for new GitHub Releases
      # 每周一 UTC 03:00（北京时间 11:00）
      ScheduleExpression: cron(0 3 ? * MON *)
      State: ENABLED
      Targets:
        - Id: UpdaterLambda
          Arn: !GetAtt UpdaterFunction.Arn

  UpdaterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdaterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt UpdaterSchedule.Arn

  # ===== AgentCore: AI 账单总结 Agent =====
  AgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-agentcore-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AgentCoreBedrockInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}/agent.zip"

  AgentCoreRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    DependsOn: CodeObject
    Properties:
      AgentRuntimeName: bedrock_cost_guard_summarizer
      Description: "AI billing summary agent for Bedrock Cost Guard"
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !Ref CodeBucket
              Prefix: agent.zip
              VersionId: !GetAtt CodeObject.AgentVersionId
          Runtime: PYTHON_3_13
          EntryPoint:
            - main.py
      NetworkConfiguration:
        NetworkMode: PUBLIC
      RoleArn: !GetAtt AgentCoreRole.Arn
      LifecycleConfiguration:
        IdleRuntimeSessionTimeout: 300
        MaxLifetime: 1800

  AgentCoreEndpoint:
    Type: AWS::BedrockAgentCore::RuntimeEndpoint
    Properties:
      AgentRuntimeId: !GetAtt AgentCoreRuntime.AgentRuntimeId
      Name: bedrock_cost_guard_summarizer_ep

Outputs:
  MonitorFunctionName:
    Value: !Ref MonitorFunction
  ReconcilerFunctionName:
    Value: !Ref ReconcilerFunction
  UpdaterFunctionName:
    Value: !Ref UpdaterFunction
    Description: Auto-upgrade controller Lambda
  DeployedCommitSha:
    Value: !GetAtt CodeObject.CommitSha
    Description: Commit SHA actually deployed
  DeployedReleaseTag:
    Value: !GetAtt CodeObject.ReleaseTag
    Description: GitHub Release tag actually deployed (empty if a raw SHA was pinned)
  StackUpdateRoleArn:
    Value: !GetAtt StackUpdateRole.Arn
    Description: >
      CloudFormation service role used by the auto-updater. Pass it explicitly
      (--role-arn) if you ever need to recover the stack manually.
  ConfigTableName:
    Value: !Ref ConfigTable
  CodeBucketName:
    Value: !Ref CodeBucket
  WebConsoleUrl:
    Value: !Sub "https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Description: Web Console URL
  AgentCoreEndpointArn:
    Value: !GetAtt AgentCoreEndpoint.AgentRuntimeEndpointArn
    Description: AgentCore Runtime Endpoint ARN (for AI billing summary)
